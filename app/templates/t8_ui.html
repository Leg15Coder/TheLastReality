{% extends "base.html" %}
{% block title %}Task 8 (Uniform Dist. Estimates){% endblock %}

{% block content %}
<div class="stats-container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.8rem;">
    <h1 style="margin:0;">T.8: Оценки для U[0, theta]</h1>
    <a href="/api/stats" style="color: #fff; text-decoration: none; background: rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 8px;">⬅ В галерею</a>
  </div>

  <form id="params-form" action="/api/stats/t8/run" method="post" onsubmit="return false;">
    <div class="form-row">
      <div class="form-field">
        <label for="theta">True theta</label>
        <input type="number" name="theta" id="theta" value="5" step="0.1" />
      </div>

      <div class="form-field">
        <label for="n">Sample size (n)</label>
        <input type="number" name="n" id="n" value="100" min="10" max="1000" />
      </div>

      <div class="form-field">
        <label for="simulations">Simulations (k)</label>
        <input type="number" name="simulations" id="simulations" value="10000" min="100" />
      </div>

      <div class="form-actions">
        <button type="button" id="run-btn">Сравнить оценки</button>
      </div>
    </div>
  </form>

  <div id="status" class="status"></div>

  <div id="runs-container"></div>
</div>

<link rel="stylesheet" href="/static/css/stats_ui.css">
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('params-form');
  const status = document.getElementById('status');
  const runsContainer = document.getElementById('runs-container');
  const runBtn = document.getElementById('run-btn');

  async function runSimulation() {
    runsContainer.innerHTML = '';
    status.textContent = 'Вычисляю...'; status.className = 'status';
    runBtn.disabled = true;

    try {
      const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'x-requested-with': 'XMLHttpRequest' } });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      status.textContent = 'Готово!';

      const card = document.createElement('div'); card.className = 'result-card';
      const stats = document.createElement('div');
      stats.innerHTML = `<h3 style="color:#fff; margin-bottom:1rem;">Дисперсии оценок (theta=${data.theta}, n=${data.n}, ${data.simulations} симуляций)</h3>
        <ul style="color:#ddd; font-size:1.1rem; line-height:1.6; margin-bottom:2rem;">
          <li><b>theta_1 (Оптимальная/ОМП, max(Xi)):</b><br/>Теоретическая: ${data.var_opt_theo.toExponential(4)}<br/>Эмпирическая: ${data.var_opt_emp.toExponential(4)}</li>
          <li><b>theta_2 (ОММ, 2*mean(Xi)):</b><br/>Теоретическая: ${data.var_mom_theo.toExponential(4)}<br/>Эмпирическая: ${data.var_mom_emp.toExponential(4)}</li>
        </ul>`;

      card.appendChild(stats);
      const grid = document.createElement('div'); grid.className = 'images-grid';

      data.images.forEach(imgData => {
        const col = document.createElement('div'); col.className = 'img-col';
        const label = document.createElement('div'); label.className = 'img-label'; label.textContent = imgData.title;
        const img = document.createElement('img'); img.className = 'result-img'; img.src = imgData.src;
        col.appendChild(label); col.appendChild(img); grid.appendChild(col);
      });
      card.appendChild(grid); runsContainer.appendChild(card);
    } catch (err) {
      status.textContent = 'Ошибка: ' + err.message; status.className = 'status error';
    } finally { runBtn.disabled = false; }
  }

  runBtn.addEventListener('click', runSimulation);
});
</script>
{% endblock %}
